<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Sign in · Blue Marble Globe</title>
  <style>
    /* The app's own look (src/guide.css, src/studio/studio.css) */
    :root {
      --bg: rgba(12, 18, 28, 0.88);
      --fg: #e6e9ee;
      --muted: #9aa4b2;
      --line: rgba(255, 255, 255, 0.1);
      --accent: #7cb7ff;
      --error: #ff8a7c;
      --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, sans-serif;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      display: grid;
      place-items: center;
      padding: 16px;
      background: #05080d;
      color: var(--fg);
      font: 14px/1.5 var(--font);
      overflow: hidden;
    }
    /* The Earth, from this server's own Blue Marble tile, blurred behind the card */
    .earth {
      position: fixed;
      inset: 0;
      background: radial-gradient(circle at 50% 55%, transparent 0 30%, #05080d 62%),
                  url("/tiles/blue-marble-webp/0/0/0.webp") center 55% / min(110vmin, 900px) no-repeat;
      filter: blur(2px) saturate(0.9);
      opacity: 0.55;
    }
    main {
      position: relative;
      width: min(360px, 100%);
      padding: 28px 26px 22px;
      border: 1px solid var(--line);
      border-radius: 14px;
      background: var(--bg);
      backdrop-filter: blur(10px);
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
    }
    h1 { margin: 0; font-size: 18px; font-weight: 650; }
    .sub { margin: 2px 0 22px; color: var(--muted); font-size: 13px; }
    .badge {
      display: inline-block;
      margin-left: 6px;
      padding: 1px 7px;
      border-radius: 999px;
      background: rgba(255, 210, 124, 0.15);
      color: #ffd27c;
      font-size: 11px;
      font-weight: 600;
      vertical-align: 2px;
    }
    label { display: grid; gap: 5px; margin-bottom: 14px; color: var(--muted); font-size: 12px; }
    input {
      width: 100%;
      padding: 9px 11px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: rgba(0, 0, 0, 0.3);
      color: var(--fg);
      font: 14px var(--font);
    }
    input:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px rgba(124, 183, 255, 0.18); }
    button {
      width: 100%;
      margin-top: 6px;
      padding: 10px;
      border: 1px solid var(--accent);
      border-radius: 8px;
      background: rgba(124, 183, 255, 0.28);
      color: var(--fg);
      font: 600 14px var(--font);
      cursor: pointer;
    }
    button:hover { background: rgba(124, 183, 255, 0.38); }
    button:disabled { opacity: 0.6; cursor: wait; }
    .message { min-height: 20px; margin: 12px 0 0; color: var(--error); font-size: 13px; }
    .back { display: block; margin-top: 14px; color: var(--muted); font-size: 12.5px; text-decoration: none; }
    .back:hover { color: var(--fg); }
  </style>
</head>
<body>
  <div class="earth" aria-hidden="true"></div>
  <main>
    <h1>Blue Marble Globe <span class="badge">admin</span></h1>
    <p class="sub">Sign in to manage this server's regions.</p>
    <form>
      <label>Username <input name="username" autocomplete="username" required autofocus></label>
      <label>Password <input name="password" type="password" autocomplete="current-password" required></label>
      <button type="submit">Sign in</button>
      <p class="message" role="alert"></p>
    </form>
    <a class="back" href="/globe/">← Back to the globe</a>
  </main>
  <script>
    // Where to go after signing in: only a path on this site (never another site, or "//host")
    const raw = new URLSearchParams(location.search).get("next") || "/admin/";
    const next = /^\/(?!\/)/.test(raw) ? raw : "/admin/";
    const form = document.querySelector("form");
    const message = document.querySelector(".message");
    const button = form.querySelector("button");

    // Already signed in: straight on
    fetch("/auth/me").then((r) => r.ok && location.replace(next), () => {});

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      message.textContent = "";
      button.disabled = true;
      button.textContent = "Signing in…";
      try {
        const res = await fetch("/auth/login", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ username: form.username.value, password: form.password.value }),
        });
        if (res.ok) return location.replace(next);
        const body = await res.json().catch(() => ({}));
        message.textContent =
          res.status === 429 ? "Too many attempts. Wait a minute and try again."
          : res.status === 502 || res.status === 504 ? "The map server's admin service (builder or importer) isn't running, so sign-in is unavailable."
          : body.error || "Couldn't sign in.";
        form.password.select();
      } catch {
        message.textContent = "Couldn't reach the server.";
      }
      button.disabled = false;
      button.textContent = "Sign in";
    });
  </script>
</body>
</html>
