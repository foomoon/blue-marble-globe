# The admin page, its sign-in and its API. $mapserver_backend handles them (mapserver-config.sh sets
# it): the builder container (MAPSERVER_ADMIN=on: Regions, builds) or, on an air-gapped server, the
# importer (MAPSERVER_ADMIN=import: the Import page, for region packs). Left out when
# MAPSERVER_ADMIN=off: serve-only.
    # The admin page and its API, for signed-in users only. The back end checks the session cookie
    # (auth_request /auth/check) on every request; without one, pages go to the sign-in page and API
    # calls get 401. Upstreams are resolved per request, so nginx starts (and serves maps) without
    # the back end.
    location = /_auth {
        internal;
        resolver 127.0.0.11 valid=10s;   # Docker's DNS
        proxy_pass http://$mapserver_backend/auth/check;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Host $http_host;
        client_max_body_size 8g;   # the check sees the request's size too: as large as /api/import allows
    }
    location @signin {
        return 302 /login/?next=$request_uri;
    }
    location = /admin {
        return 301 /admin/;
    }
    location /admin/ {
        auth_request /_auth;
        error_page 401 = @signin;
        include /etc/nginx/mime.types;
        root /srv;
        try_files $uri $uri/ =404;
        add_header Cache-Control "no-cache" always;
    }
    location /api/ {
        auth_request /_auth;
        resolver 127.0.0.11 valid=10s;
        proxy_pass http://$mapserver_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;    # the API checks requests come from this site
        proxy_buffering off;                 # build progress streams live (Server-Sent Events)
        proxy_read_timeout 1h;
        client_max_body_size 64k;
    }
    # Importing a region pack (the importer only): a large upload, streamed straight through
    location = /api/import {
        auth_request /_auth;
        resolver 127.0.0.11 valid=10s;
        proxy_pass http://$mapserver_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_request_buffering off;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
        client_max_body_size 8g;
        client_body_timeout 10m;
    }

    # Signing in: the page (public), and the sign-in API, rate-limited per address
    location /login/ {
        include /etc/nginx/mime.types;
        root /srv;
        try_files $uri $uri/ =404;
        add_header Cache-Control "no-cache" always;
    }
    location = /login {
        return 301 /login/;
    }
    location = /auth/login {
        limit_req zone=signin burst=5 nodelay;   # password attempts only
        limit_req_status 429;
        resolver 127.0.0.11 valid=10s;
        proxy_pass http://$mapserver_backend;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $mapserver_scheme;  # Secure cookies behind HTTPS
        client_max_body_size 4k;
    }
    location /auth/ {
        resolver 127.0.0.11 valid=10s;
        proxy_pass http://$mapserver_backend;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $mapserver_scheme;  # Secure cookies behind HTTPS
        client_max_body_size 4k;
    }
