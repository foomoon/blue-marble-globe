# The admin page, its sign-in and its API, all handled by the builder container. Left out when
# MAPSERVER_ADMIN=off (the serve-only setup: see mapserver-config.sh).
    # The admin page and its API, for signed-in users only. The builder checks the session cookie
    # (auth_request /auth/check) on every request; without one, pages go to the sign-in page and API
    # calls get 401. Upstreams are resolved per request, so nginx starts (and serves maps) without
    # the builder.
    location = /_auth {
        internal;
        resolver 127.0.0.11 valid=10s;   # Docker's DNS
        set $auth_check http://builder:8090/auth/check;
        proxy_pass $auth_check;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Host $http_host;
    }
    location @signin {
        return 302 /login/?next=$request_uri;
    }
    location = /admin {
        return 301 /admin/;
    }
    location /admin/ {
        auth_request /_auth;
        error_page 401 = @signin;
        include /etc/nginx/mime.types;
        root /srv;
        try_files $uri $uri/ =404;
        add_header Cache-Control "no-cache" always;
    }
    location /api/ {
        auth_request /_auth;
        resolver 127.0.0.11 valid=10s;
        set $builder http://builder:8090;
        proxy_pass $builder;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;    # the API checks requests come from this site
        proxy_buffering off;                 # build progress streams live (Server-Sent Events)
        proxy_read_timeout 1h;
        client_max_body_size 64k;
    }

    # Signing in: the page (public), and the sign-in API, rate-limited per address
    location /login/ {
        include /etc/nginx/mime.types;
        root /srv;
        try_files $uri $uri/ =404;
        add_header Cache-Control "no-cache" always;
    }
    location = /login {
        return 301 /login/;
    }
    location = /auth/login {
        limit_req zone=signin burst=5 nodelay;   # password attempts only
        limit_req_status 429;
        resolver 127.0.0.11 valid=10s;
        set $builder http://builder:8090;
        proxy_pass $builder;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $mapserver_scheme;  # Secure cookies behind HTTPS
        client_max_body_size 4k;
    }
    location /auth/ {
        resolver 127.0.0.11 valid=10s;
        set $builder http://builder:8090;
        proxy_pass $builder;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $mapserver_scheme;  # Secure cookies behind HTTPS
        client_max_body_size 4k;
    }
