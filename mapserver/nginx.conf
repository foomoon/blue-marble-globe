# Blue Marble Globe map server.
#   /                                  index page (generated by scripts/build_server.py)
#   /catalog.json                      every layer, machine-readable
#   /tiles/<layer>/tilejson.json       TileJSON 3.0.0 per tiled layer
#   /tiles/<layer>/{z}/{x}/{y}.<ext>   XYZ tiles; tiles a layer deliberately lacks answer 204
#   /tiles/<layer>/PROVENANCE.json     how that layer was built
#   /vectors/<name>.geojson            vector layers
#   /provenance/                       checksums, build records, archived terms
#   /licensing, /notice                LICENSING.md, NOTICE
# The address a request came in on, for the absolute URLs in the catalog, TileJSON and index
# page. Behind a TLS-terminating proxy, honour its X-Forwarded-Proto.
map $http_x_forwarded_proto $mapserver_scheme {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

# Sign-in attempts: 10 a minute per address (plus a burst of 5), then 429
limit_req_zone $binary_remote_addr zone=signin:1m rate=10r/m;

server {
    listen 8080;
    server_name _;
    root /srv/www;
    server_tokens off;
    charset utf-8;

    gzip on;
    gzip_types application/json application/geo+json text/markdown text/plain text/css;
    gzip_min_length 1024;

    types {
        text/html html;
        application/json json;
        application/geo+json geojson;
        image/jpeg jpg;
        image/png png;
        image/webp webp;
        text/markdown md;
    }

    location = / {
        include /etc/nginx/cors.conf;
        include /etc/nginx/origin.conf;
        add_header Cache-Control "no-cache" always;
        try_files /index.html =404;
    }

    # The globe itself (npm run server:globe builds it): same address as its data, so it needs
    # no settings and no cross-origin rules. Full MIME types here: browsers refuse JavaScript
    # modules served as anything else.
    location = /globe {
        return 301 /globe/;
    }
    location /globe/ {
        include /etc/nginx/mime.types;
        root /srv;
        try_files $uri $uri/ =404;
        add_header Cache-Control "no-cache" always; # small, and must pick up a rebuilt globe
    }

    # The admin page and its API, for signed-in users only. The builder checks the session cookie
    # (auth_request /auth/check) on every request; without one, pages go to the sign-in page and API
    # calls get 401. Upstreams are resolved per request, so nginx starts (and serves maps) without
    # the builder.
    location = /_auth {
        internal;
        resolver 127.0.0.11 valid=10s;   # Docker's DNS
        set $auth_check http://builder:8090/auth/check;
        proxy_pass $auth_check;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Host $http_host;
    }
    location @signin {
        return 302 /login/?next=$request_uri;
    }
    location = /admin {
        return 301 /admin/;
    }
    location /admin/ {
        auth_request /_auth;
        error_page 401 = @signin;
        include /etc/nginx/mime.types;
        root /srv;
        try_files $uri $uri/ =404;
        add_header Cache-Control "no-cache" always;
    }
    location /api/ {
        auth_request /_auth;
        resolver 127.0.0.11 valid=10s;
        set $builder http://builder:8090;
        proxy_pass $builder;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;    # the API checks requests come from this site
        proxy_buffering off;                 # build progress streams live (Server-Sent Events)
        proxy_read_timeout 1h;
        client_max_body_size 64k;
    }

    # Signing in: the page (public), and the sign-in API, rate-limited per address
    location /login/ {
        include /etc/nginx/mime.types;
        root /srv;
        try_files $uri $uri/ =404;
        add_header Cache-Control "no-cache" always;
    }
    location = /login {
        return 301 /login/;
    }
    location = /auth/login {
        limit_req zone=signin burst=5 nodelay;   # password attempts only
        limit_req_status 429;
        resolver 127.0.0.11 valid=10s;
        set $builder http://builder:8090;
        proxy_pass $builder;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $mapserver_scheme;  # Secure cookies behind HTTPS
        client_max_body_size 4k;
    }
    location /auth/ {
        resolver 127.0.0.11 valid=10s;
        set $builder http://builder:8090;
        proxy_pass $builder;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $mapserver_scheme;  # Secure cookies behind HTTPS
        client_max_body_size 4k;
    }

    location = /catalog.json {
        include /etc/nginx/cors.conf;
        include /etc/nginx/origin.conf;
        add_header Cache-Control "no-cache" always;
    }

    location ~ ^/tiles/(.+)/tilejson\.json$ {
        include /etc/nginx/cors.conf;
        include /etc/nginx/origin.conf;
        add_header Cache-Control "no-cache" always;
        alias /srv/www/tilejson/$1.json;
    }

    # Terrain tiles. A missing one is all sea (the builds only write tiles with land), so it answers
    # a flat sea-level tile: MapLibre's terrain needs a real tile everywhere (204 makes it fail
    # with "dem dimension mismatch").
    location ~ ^/tiles/(terrain|landsat/[a-z0-9-]+/terrain)/\d+/\d+/\d+\.webp$ {
        include /etc/nginx/cors.conf;
        add_header Cache-Control "public, max-age=86400" always;
        root /srv;
        try_files $uri /_sea-level.webp;
    }

    location = /_sea-level.webp {
        internal;
        include /etc/nginx/cors.conf;
        add_header Cache-Control "public, max-age=86400" always;
        alias /etc/nginx/sea-level.webp;
    }

    # Tiles. A missing tile inside a layer is one the build skipped on purpose (all ocean, or
    # outside a region): 204 tells web maps "blank", where 404 would be logged as an error.
    location ~ ^/tiles/[a-z0-9/-]+/\d+/\d+/\d+\.(jpg|png|webp)$ {
        include /etc/nginx/cors.conf;
        add_header Cache-Control "public, max-age=86400" always;
        root /srv;
        try_files $uri =204;
    }

    # Each layer's record and tile list, and the list of built regions (the globe reads it when
    # it takes its data from this server: VITE_MAP_SERVER_URL)
    location ~ ^/tiles/[a-z0-9/-]+/(PROVENANCE|tiles|index)\.json$ {
        include /etc/nginx/cors.conf;
        add_header Cache-Control "no-cache" always;
        root /srv;
    }

    location /tiles/ {
        return 404;
    }

    location /vectors/ {
        include /etc/nginx/cors.conf;
        add_header Cache-Control "public, max-age=86400" always;
        root /srv;
    }

    location /provenance/ {
        include /etc/nginx/cors.conf;
        add_header Cache-Control "no-cache" always;
        root /srv;
        autoindex on;
    }

    location = /licensing {
        include /etc/nginx/cors.conf;
        default_type text/plain;
        alias /srv/docs/LICENSING.md;
    }

    location = /notice {
        include /etc/nginx/cors.conf;
        default_type text/plain;
        alias /srv/docs/NOTICE;
    }

    location = /healthz {
        include /etc/nginx/cors.conf; # a globe on another origin checks it (the "Data: map server" dot)
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }
}
