# Any site may load these layers (they're public domain or freely usable; see /licensing).
add_header Access-Control-Allow-Origin "*" always;
add_header Access-Control-Allow-Methods "GET, HEAD, OPTIONS" always;
add_header Access-Control-Expose-Headers "ETag, Content-Length" always;
add_header Access-Control-Allow-Headers "Range, If-None-Match, If-Modified-Since" always;
# Chrome asks before a page reaches a server on a private network (e.g. this one on your LAN)
add_header Access-Control-Allow-Private-Network "true" always;
add_header Access-Control-Max-Age "86400" always;

# Answer CORS preflights directly
if ($request_method = OPTIONS) {
    return 204;
}
